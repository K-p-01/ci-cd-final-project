apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-pipelines-oc-final
spec:
  description: "CI/CD pipeline: cleanup, git-clone, flake8, nose, buildah, deploy."
  params:
    - name: git-url
      type: string
      description: Public HTTPS URL of this repository.
    - name: revision
      type: string
      default: main
    - name: image-url
      type: string
      description: Full internal registry image URL, including namespace and tag.
    - name: deployment-name
      type: string
      default: cicd-app
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "$(params.git-url)"
        - name: revision
          value: "$(params.revision)"
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: nose
      runAfter: [flake8]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: buildah
      runAfter: [nose]
      taskRef:
        name: buildah
      params:
        - name: image-url
          value: "$(params.image-url)"
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: openshift-client
      params:
        - name: image-url
          value: "$(params.image-url)"
        - name: deployment-name
          value: "$(params.deployment-name)"
